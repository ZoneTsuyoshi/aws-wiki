name: Deploy wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Graphviz and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check exercises
        run: python scripts/check_exercises.py

      - name: Generate diagrams
        run: for f in diagrams_src/*.py; do python "$f"; done

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=aws-wiki --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
